# Tempo configuration for the local observability profile.
#
# Single-binary mode with local disk storage: enough to follow a trace from an
# HTTP request through to the SQL statement that served it, and nothing more.

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short flush windows so a trace appears in Grafana seconds after the request,
  # rather than after the production-tuned default.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
