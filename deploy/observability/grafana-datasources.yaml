# Grafana datasource provisioning.
#
# Provisioned from a file so `docker compose --profile observability up` gives a
# working Grafana with no manual setup: open http://localhost:3000 and the
# datasources are already there.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: ratiba-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s

  - name: Tempo
    type: tempo
    uid: ratiba-tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Links a trace's span metrics back to Prometheus, so a slow request can
      # be pivoted from the trace view into the latency histogram.
      tracesToMetrics:
        datasourceUid: ratiba-prometheus
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: ratiba-prometheus
