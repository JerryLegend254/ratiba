version: "2"
sql:
  - engine: postgresql
    # The goose migrations are the single source of schema truth; sqlc reads
    # them directly so generated code can never drift from what is deployed.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/postgres/sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
