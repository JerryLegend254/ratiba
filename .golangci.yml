# golangci-lint configuration.
#
# The selection is deliberately opinionated rather than "everything on". Every
# linter here has caught, or would catch, a class of bug that matters in this
# codebase. Linters that mostly produce style noise are off, because a lint
# suite people learn to ignore protects nothing.

version: "2"

run:
  timeout: 5m
  # The integration suite is behind a build tag and would otherwise be invisible
  # to every linter.
  build-tags:
    - integration

linters:
  default: none
  enable:
    # --- correctness ---
    - errcheck        # an unchecked error is the most common Go bug there is
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose       # a leaked HTTP response body leaks a connection
    - rowserrcheck    # a missed rows.Err() silently truncates a result set
    - sqlclosecheck
    - nilerr          # returning nil after checking err != nil
    - errorlint       # == comparison on errors instead of errors.Is
    - contextcheck    # a dropped context breaks cancellation and tracing
    - noctx           # HTTP requests with no context cannot be cancelled

    # --- security ---
    - gosec

    # --- clarity ---
    - revive
    - misspell
    - unconvert
    - unparam
    - wastedassign
    - copyloopvar
    - usestdlibvars
    - predeclared     # shadowing a builtin such as `len` or `new`
    - durationcheck   # multiplying two durations, which is almost never right

    # --- test quality ---
    - testifylint
    - tparallel       # t.Parallel() misuse silently serialises the suite
    - thelper         # helpers that forget t.Helper() report the wrong line

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      # Deliberately ignored: a rollback after a successful commit is a no-op,
      # and a failed rollback is unactionable — the transaction is finished
      # either way and the real error is already being returned.
      - (github.com/jackc/pgx/v5.Tx).Rollback

  govet:
    enable-all: true
    disable:
      # Struct field alignment is a micro-optimisation that would force field
      # ordering to fight readability across the whole codebase.
      - fieldalignment

  gosec:
    excludes:
      # G104 duplicates errcheck.
      - G104

  revive:
    rules:
      - name: exported
        # Every exported symbol needs a doc comment; this codebase is meant to
        # be readable by someone who has never seen it.
        arguments: [checkPrivateReceivers, disableStutteringCheck]
      - name: package-comments
      - name: indent-error-flow
      - name: errorf
      - name: context-as-argument
      - name: context-keys-type
      - name: time-naming
      - name: var-declaration
      - name: unexported-return
      - name: blank-imports
      - name: range
      - name: receiver-naming
      - name: increment-decrement
      - name: error-return
      - name: error-strings
      - name: error-naming

  staticcheck:
    checks: ["all"]

issues:
  # Report everything rather than the default first-few-per-linter.
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Generated code is not ours to lint or to document.
    - path: internal/postgres/sqlcgen/
      linters: [revive, staticcheck, unused, gosec, errcheck, unparam]

    # Tests may use weak randomness, ignore some errors in setup, and are
    # allowed longer functions than production code.
    - path: _test\.go
      linters: [gosec, errcheck, unparam, contextcheck]

    # The migrate command legitimately exits the process.
    - path: cmd/migrate/
      text: "deep-exit"

  exclude-dirs:
    - internal/postgres/sqlcgen
